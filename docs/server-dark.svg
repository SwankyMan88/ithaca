<text x="98" y="180.0" font-size="17" fill="#e6edf3" font-weight="600">Your app</text>
<text x="98" y="202.0" font-size="13" fill="#8b949e">scripts, bots, tools</text>
</g>
<g class="up" style="animation-delay:0.30s"><rect x="400" y="124" width="270" height="116" rx="14" fill="#161b22" stroke="#8b7dff"/>
