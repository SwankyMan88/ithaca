<text x="354" y="266" font-size="13" fill="#59636e">F5-TTS + Vocos</text>
</g>
<g class="up" style="animation-delay:0.50s"><rect x="556" y="204" width="244" height="88" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
