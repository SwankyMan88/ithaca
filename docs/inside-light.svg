<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
<style>
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.up{opacity:0;transform-box:fill-box;transform:translateY(10px);animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
.num{opacity:0;animation:show .5s ease-out forwards}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes show{to{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.bar,.up,.num,.flow,.pulse{animation:none;opacity:1;transform:none}}
</style>
<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#2fb5ff"/></linearGradient></defs>
<rect width="1100" height="330" rx="16" fill="#ffffff"/>
<text x="36" y="48" font-size="22" fill="#1f2328" font-weight="600">What's inside the 2 MB</text>
<text x="36" y="76" font-size="15" fill="#59636e">Written from scratch in C++. GPU code is generated at startup and compiled by the driver you already have.</text>
<g class="up" style="animation-delay:0.08s"><rect x="36" y="100" width="244" height="88" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<path transform="translate(54 130) scale(1.1666666666666667)" d="M7 7h10v10H7z M10 3v4 M14 3v4 M10 17v4 M14 17v4 M3 10h4 M3 14h4 M17 10h4 M17 14h4" fill="none" stroke="#7c6cff" stroke-width="1.7142857142857142" stroke-linecap="round" stroke-linejoin="round"/>
<text x="94" y="140" font-size="15" fill="#1f2328" font-weight="600">Model loaders</text>
<text x="94" y="162" font-size="13" fill="#59636e">GGUF, every quant type</text>
</g>
<g class="up" style="animation-delay:0.15s"><rect x="296" y="100" width="244" height="88" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<path transform="translate(314 130) scale(1.1666666666666667)" d="M8 7l-5 5 5 5 M16 7l5 5-5 5 M14 4l-4 16" fill="none" stroke="#7c6cff" stroke-width="1.7142857142857142" stroke-linecap="round" stroke-linejoin="round"/>
<text x="354" y="140" font-size="15" fill="#1f2328" font-weight="600">Tokenizers + templates</text>
<text x="354" y="162" font-size="13" fill="#59636e">Llama, Qwen, Gemma, Phi...</text>
</g>
<g class="up" style="animation-delay:0.22s"><rect x="556" y="100" width="244" height="88" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
