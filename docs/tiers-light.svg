<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
<style>
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.up{opacity:0;transform-box:fill-box;transform:translateY(10px);animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
.num{opacity:0;animation:show .5s ease-out forwards}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes show{to{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.bar,.up,.num,.flow,.pulse{animation:none;opacity:1;transform:none}}
</style>
<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#2fb5ff"/></linearGradient></defs>
<rect width="1100" height="400" rx="16" fill="#ffffff"/>
<text x="36" y="48" font-size="22" fill="#1f2328" font-weight="600">Where a model's layers live</text>
<text x="36" y="76" font-size="15" fill="#59636e">Ithaca fills the fastest memory first and streams the rest, so models bigger than your GPU still run.</text>
<g class="up" style="animation-delay:0.15s"><rect x="36" y="104" width="1028" height="76" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="36" y="104" width="6" height="76" rx="3" fill="#7c6cff"/>
<path transform="translate(62 126) scale(1.3333333333333333)" d="M2 7h20v10H2z M6 17v3 M18 17v3 M8 12a2 2 0 1 0 0.01 0 M16 12a2 2 0 1 0 0.01 0" fill="none" stroke="#7c6cff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="112" y="138" font-size="19" fill="#1f2328" font-weight="600">VRAM</text>
<text x="112" y="162" font-size="14" fill="#59636e">Output head and as many layers as fit. Generation replays a CUDA graph.</text>
</g>
<rect class="bar" style="animation-delay:0.45s" x="860" y="130" width="180" height="12" rx="6" fill="#7c6cff"/>
<text x="860" y="164" font-size="13" fill="#59636e" class="num" style="animation-delay:0.75s">fastest</text>
<g class="up" style="animation-delay:0.40s"><rect x="36" y="196" width="1028" height="76" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="36" y="196" width="6" height="76" rx="3" fill="#2fb5ff"/>
<path transform="translate(62 218) scale(1.3333333333333333)" d="M2 8h20v8H2z M6 8v8 M10 8v8 M14 8v8 M18 8v8 M4 16v3 M20 16v3" fill="none" stroke="#2fb5ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="112" y="230" font-size="19" fill="#1f2328" font-weight="600">RAM</text>
<text x="112" y="254" font-size="14" fill="#59636e">The next layers, locked so Windows doesn't page them out.</text>
</g>
<rect class="bar" style="animation-delay:0.70s" x="860" y="222" width="118" height="12" rx="6" fill="#2fb5ff"/>
<text x="860" y="256" font-size="13" fill="#59636e" class="num" style="animation-delay:1.00s">fast</text>
<g class="up" style="animation-delay:0.65s"><rect x="36" y="288" width="1028" height="76" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="36" y="288" width="6" height="76" rx="3" fill="#d97706"/>
<path transform="translate(62 310) scale(1.3333333333333333)" d="M3 6h18v12H3z M7 10h6 M7 14h3 M17 12h.01" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="112" y="322" font-size="19" fill="#1f2328" font-weight="600">SSD</text>
<text x="112" y="346" font-size="14" fill="#59636e">Everything else, memory-mapped and read ahead while the current layer runs.</text>
</g>
<rect class="bar" style="animation-delay:0.95s" x="860" y="314" width="72" height="12" rx="6" fill="#d97706"/>
<text x="860" y="348" font-size="13" fill="#59636e" class="num" style="animation-delay:1.25s">streams</text>
<text x="36" y="388" font-size="13.5" fill="#59636e">About 768 MB of VRAM and 2.5 GB of RAM stay free for other programs by default (Settings can change both).</text>
</svg>