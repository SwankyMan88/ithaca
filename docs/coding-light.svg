<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
<style>
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.up{opacity:0;transform-box:fill-box;transform:translateY(10px);animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){.bar,.up,.flow{animation:none;opacity:1;transform:none}}
</style>
<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7dff"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
<rect width="1100" height="330" rx="16" fill="#ffffff"/>
<text x="36" y="48" font-size="22" fill="#1f2328" font-weight="600">A coding agent that works in your own folder</text>
<text x="36" y="76" font-size="15" fill="#59636e">Code, Word, PowerPoint and Excel files · every change shown as a diff · nothing leaves this PC</text>
<g class="up" style="animation-delay:0.10s"><rect x="36" y="108" width="236" height="78" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><circle cx="66" cy="147" r="14" fill="url(#acc)"/><text x="66" y="152" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="92" y="142" font-size="17" fill="#1f2328" font-weight="600">Look</text><text x="92" y="164" font-size="12.5" fill="#59636e">list_dir · search · read_file</text></g>
<line class="flow" x1="274" y1="147" x2="290" y2="147" stroke="url(#acc)" stroke-width="2.5"/>
<g class="up" style="animation-delay:0.22s"><rect x="292" y="108" width="236" height="78" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><circle cx="322" cy="147" r="14" fill="url(#acc)"/><text x="322" y="152" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="348" y="142" font-size="17" fill="#1f2328" font-weight="600">Change</text><text x="348" y="164" font-size="12.5" fill="#59636e">edit_file · write_file · set_cell</text></g>
<line class="flow" x1="530" y1="147" x2="546" y2="147" stroke="url(#acc)" stroke-width="2.5"/>
<g class="up" style="animation-delay:0.34s"><rect x="548" y="108" width="236" height="78" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><circle cx="578" cy="147" r="14" fill="url(#acc)"/><text x="578" y="152" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="604" y="142" font-size="17" fill="#1f2328" font-weight="600">Check</text><text x="604" y="164" font-size="12.5" fill="#59636e">run_command (you approve it)</text></g>
<line class="flow" x1="786" y1="147" x2="802" y2="147" stroke="url(#acc)" stroke-width="2.5"/>
<g class="up" style="animation-delay:0.46s"><rect x="804" y="108" width="236" height="78" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><circle cx="834" cy="147" r="14" fill="url(#acc)"/><text x="834" y="152" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="860" y="142" font-size="17" fill="#1f2328" font-weight="600">Report</text><text x="860" y="164" font-size="12.5" fill="#59636e">a short summary, Undo all</text></g>
<text x="36" y="228" font-size="15" fill="#1f2328" font-weight="600">Ithaca's own test bench · Qwen3-Coder 30B on an RTX 3060 12 GB · 8 tasks</text>
<text x="36" y="265" font-size="13.5" fill="#59636e">Before the eval fixes</text><rect x="210" y="250" width="640" height="22" rx="6" fill="#eaeef2"/><rect class="bar" style="animation-delay:0.5s" x="210" y="250" width="243" height="22" rx="6" fill="url(#acc)"/><text x="866" y="266" font-size="14" fill="#1f2328" font-weight="600">38% passed · 138 s a task</text>
<text x="36" y="299" font-size="13.5" fill="#59636e">After</text><rect x="210" y="284" width="640" height="22" rx="6" fill="#eaeef2"/><rect class="bar" style="animation-delay:0.7s" x="210" y="284" width="480" height="22" rx="6" fill="url(#acc)"/><text x="866" y="300" font-size="14" fill="#1f2328" font-weight="600">75% passed · 67 s a task</text>
</svg>