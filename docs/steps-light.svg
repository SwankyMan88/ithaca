<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="190" viewBox="0 0 1100 190" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
<style>
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.up{opacity:0;transform-box:fill-box;transform:translateY(10px);animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
.num{opacity:0;animation:show .5s ease-out forwards}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes show{to{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.bar,.up,.num,.flow,.pulse{animation:none;opacity:1;transform:none}}
</style>
<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#2fb5ff"/></linearGradient></defs>
<rect width="1100" height="190" rx="16" fill="#ffffff"/>
<g class="up" style="animation-delay:0.10s">
<circle cx="136" cy="62" r="34" fill="url(#acc)" opacity="0.16"/>
<path transform="translate(120 46) scale(1.3333333333333333)" d="M12 3v12 M7 10l5 5 5-5 M4 20h16" fill="none" stroke="#7c6cff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="164" cy="34" r="12" fill="url(#acc)"/>
<text x="164" y="39" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="136" y="128" font-size="18" fill="#1f2328" font-weight="600" text-anchor="middle">Download</text>
<text x="136" y="152" font-size="14" fill="#59636e" text-anchor="middle">Ithaca.exe, about 2 MB</text>
</g>
<path class="flow" d="M225 62 H293" stroke="#7c6cff" stroke-width="2.5"/>
<g class="up" style="animation-delay:0.28s">
<circle cx="412" cy="62" r="34" fill="url(#acc)" opacity="0.16"/>
<path transform="translate(396 46) scale(1.3333333333333333)" d="M13 2L4 14h7l-1 8 9-12h-7z" fill="none" stroke="#7c6cff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="440" cy="34" r="12" fill="url(#acc)"/>
<text x="440" y="39" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="412" y="128" font-size="18" fill="#1f2328" font-weight="600" text-anchor="middle">Double-click</text>
<text x="412" y="152" font-size="14" fill="#59636e" text-anchor="middle">No installer, no Python</text>
</g>
<path class="flow" d="M501 62 H569" stroke="#7c6cff" stroke-width="2.5"/>
<g class="up" style="animation-delay:0.46s">
<circle cx="688" cy="62" r="34" fill="url(#acc)" opacity="0.16"/>
<path transform="translate(672 46) scale(1.3333333333333333)" d="M12 3l9 5-9 5-9-5z M3 12l9 5 9-5 M3 16l9 5 9-5" fill="none" stroke="#7c6cff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="716" cy="34" r="12" fill="url(#acc)"/>
<text x="716" y="39" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="688" y="128" font-size="18" fill="#1f2328" font-weight="600" text-anchor="middle">Pick a model</text>
<text x="688" y="152" font-size="14" fill="#59636e" text-anchor="middle">Download one, or it finds yours</text>
</g>
<path class="flow" d="M777 62 H845" stroke="#7c6cff" stroke-width="2.5"/>
<g class="up" style="animation-delay:0.64s">
<circle cx="964" cy="62" r="34" fill="url(#acc)" opacity="0.16"/>
<path transform="translate(948 46) scale(1.3333333333333333)" d="M4 5h16v10H9l-5 4z" fill="none" stroke="#7c6cff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="992" cy="34" r="12" fill="url(#acc)"/>
<text x="992" y="39" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="964" y="128" font-size="18" fill="#1f2328" font-weight="600" text-anchor="middle">Chat</text>
<text x="964" y="152" font-size="14" fill="#59636e" text-anchor="middle">Type while it loads</text>
</g>
</svg>