<text x="432" y="209" font-size="14" fill="#59636e">No tensor-core extras</text>
</g>
<g class="up" style="animation-delay:0.50s"><rect x="736" y="72" width="328" height="156" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="736" y="72" width="328" height="6" rx="3" fill="#d97706"/>
<path transform="translate(756 98) scale(1.25)" d="M7 7h10v10H7z M10 10h4v4h-4z M10 3v4 M14 3v4 M10 17v4 M14 17v4 M3 10h4 M3 14h4 M17 10h4 M17 14h4" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="800" y="120" font-size="17" fill="#1f2328" font-weight="600">Any PC with AVX2</text>
<path d="M760 156 l4 4 8-9" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="782" y="161" font-size="14" fill="#59636e">Chat on the CPU</text>
