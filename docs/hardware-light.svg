<text x="100" y="120" font-size="17" fill="#1f2328" font-weight="600">RTX 30-series or newer</text>
<path d="M60 156 l4 4 8-9" fill="none" stroke="#7c6cff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="82" y="161" font-size="14" fill="#59636e">Everything on the GPU</text>
<path d="M60 180 l4 4 8-9" fill="none" stroke="#7c6cff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="82" y="185" font-size="14" fill="#59636e">Int8 tensor cores for prompts</text>
<path d="M60 204 l4 4 8-9" fill="none" stroke="#7c6cff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="82" y="209" font-size="14" fill="#59636e">Fastest images and video</text>
</g>
<g class="up" style="animation-delay:0.30s"><rect x="386" y="72" width="328" height="156" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="386" y="72" width="328" height="6" rx="3" fill="#2fb5ff"/>
<path transform="translate(406 98) scale(1.25)" d="M2 7h20v10H2z M6 17v3 M18 17v3 M8 12a2 2 0 1 0 0.01 0 M16 12a2 2 0 1 0 0.01 0" fill="none" stroke="#2fb5ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="450" y="120" font-size="17" fill="#1f2328" font-weight="600">GTX 10 / 16, RTX 20</text>
<path d="M410 156 l4 4 8-9" fill="none" stroke="#2fb5ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="432" y="161" font-size="14" fill="#59636e">Chat on the GPU</text>
<path d="M410 180 l4 4 8-9" fill="none" stroke="#2fb5ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="432" y="185" font-size="14" fill="#59636e">Images on the GPU</text>
