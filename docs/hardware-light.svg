<text x="782" y="185" font-size="14" fill="#59636e">Nothing to install</text>
<path d="M760 204 l4 4 8-9" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="782" y="209" font-size="14" fill="#59636e">Slower, but it works</text>
