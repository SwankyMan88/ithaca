<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="616" viewBox="0 0 1104 616" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
<style>
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.up{opacity:0;transform-box:fill-box;transform:translateY(10px);animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
.num{opacity:0;animation:show .5s ease-out forwards}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes show{to{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.bar,.up,.num,.flow,.pulse{animation:none;opacity:1;transform:none}}
</style>
<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#2fb5ff"/></linearGradient></defs>
<rect width="1104" height="616" rx="16" fill="#ffffff"/>
<text x="30" y="52" font-size="22" fill="#1f2328" font-weight="600">Everything in one 2 MB exe</text>
<g class="up" style="animation-delay:0.05s"><rect x="30" y="80" width="336" height="112" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<g><rect x="48" y="100" width="44" height="44" rx="11.0" fill="url(#acc)" opacity="0.16"/><path transform="translate(56.8 108.8) scale(1.0999999999999999)" d="M4 5h16v10H9l-5 4z" fill="none" stroke="#7c6cff" stroke-width="1.8181818181818183" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="106" y="122" font-size="17" fill="#1f2328" font-weight="600">Chat</text>
<text x="106" y="146" font-size="13.5" fill="#59636e">Any GGUF model. Saved chats, edits,</text>
<text x="106" y="165" font-size="13.5" fill="#59636e">regenerate, "Think hard".</text>
</g>
<g class="up" style="animation-delay:0.11s"><rect x="384" y="80" width="336" height="112" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<g><rect x="402" y="100" width="44" height="44" rx="11.0" fill="url(#acc)" opacity="0.16"/><path transform="translate(410.8 108.8) scale(1.0999999999999999)" d="M12 3l9 5-9 5-9-5z M3 12l9 5 9-5 M3 16l9 5 9-5" fill="none" stroke="#7c6cff" stroke-width="1.8181818181818183" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="460" y="122" font-size="17" fill="#1f2328" font-weight="600">Bigger than VRAM</text>
<text x="460" y="146" font-size="13.5" fill="#59636e">Layers spill to RAM and SSD. Type</text>
<text x="460" y="165" font-size="13.5" fill="#59636e">before it finishes loading.</text>
</g>
<g class="up" style="animation-delay:0.17s"><rect x="738" y="80" width="336" height="112" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<g><rect x="756" y="100" width="44" height="44" rx="11.0" fill="url(#acc)" opacity="0.16"/><path transform="translate(764.8 108.8) scale(1.0999999999999999)" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z M12 9a3 3 0 1 0 0 6 3 3 0 1 0 0-6z" fill="none" stroke="#7c6cff" stroke-width="1.8181818181818183" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="814" y="122" font-size="17" fill="#1f2328" font-weight="600">Sees pictures</text>
<text x="814" y="146" font-size="13.5" fill="#59636e">Paste or drop an image into the</text>
<text x="814" y="165" font-size="13.5" fill="#59636e">chat.</text>
</g>
<g class="up" style="animation-delay:0.23s"><rect x="30" y="210" width="336" height="112" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<g><rect x="48" y="230" width="44" height="44" rx="11.0" fill="url(#acc)" opacity="0.16"/><path transform="translate(56.8 238.8) scale(1.0999999999999999)" d="M6 2h8l5 5v15H6z M14 2v5h5 M9 12h7 M9 16h7" fill="none" stroke="#7c6cff" stroke-width="1.8181818181818183" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="106" y="252" font-size="17" fill="#1f2328" font-weight="600">Reads files</text>
<text x="106" y="276" font-size="13.5" fill="#59636e">PDF, Word, PowerPoint, Excel, code.</text>
<text x="106" y="295" font-size="13.5" fill="#59636e">Answers cite the page.</text>
</g>
<g class="up" style="animation-delay:0.29s"><rect x="384" y="210" width="336" height="112" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<g><rect x="402" y="230" width="44" height="44" rx="11.0" fill="url(#acc)" opacity="0.16"/><path transform="translate(410.8 238.8) scale(1.0999999999999999)" d="M3 4h18v16H3z M3 16l5-5 4 4 3-3 6 6 M15.5 8.5a1.5 1.5 0 1 0 0.01 0" fill="none" stroke="#7c6cff" stroke-width="1.8181818181818183" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="460" y="252" font-size="17" fill="#1f2328" font-weight="600">Makes images</text>
<text x="460" y="276" font-size="13.5" fill="#59636e">SD 1.5, 2.x and SDXL with a live</text>
<text x="460" y="295" font-size="13.5" fill="#59636e">preview while it renders.</text>
</g>
<g class="up" style="animation-delay:0.35s"><rect x="738" y="210" width="336" height="112" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<g><rect x="756" y="230" width="44" height="44" rx="11.0" fill="url(#acc)" opacity="0.16"/><path transform="translate(764.8 238.8) scale(1.0999999999999999)" d="M4 20h4L19 9l-4-4L4 16z M14 6l4 4" fill="none" stroke="#7c6cff" stroke-width="1.8181818181818183" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="814" y="252" font-size="17" fill="#1f2328" font-weight="600">Edits pictures</text>
<text x="814" y="276" font-size="13.5" fill="#59636e">"Add a boat", or paint the part to</text>
<text x="814" y="295" font-size="13.5" fill="#59636e">change in Image studio.</text>
</g>
<g class="up" style="animation-delay:0.41s"><rect x="30" y="340" width="336" height="112" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<g><rect x="48" y="360" width="44" height="44" rx="11.0" fill="url(#acc)" opacity="0.16"/><path transform="translate(56.8 368.8) scale(1.0999999999999999)" d="M3 6h12v12H3z M15 10l6-3v10l-6-3" fill="none" stroke="#7c6cff" stroke-width="1.8181818181818183" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="106" y="382" font-size="17" fill="#1f2328" font-weight="600">Makes video</text>
<text x="106" y="406" font-size="13.5" fill="#59636e">Wan 2.2 text-to-video, saved as</text>
<text x="106" y="425" font-size="13.5" fill="#59636e">MP4.</text>
</g>
<g class="up" style="animation-delay:0.47s"><rect x="384" y="340" width="336" height="112" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<g><rect x="402" y="360" width="44" height="44" rx="11.0" fill="url(#acc)" opacity="0.16"/><path transform="translate(410.8 368.8) scale(1.0999999999999999)" d="M9 3h6v10H9z M5 11a7 7 0 0 0 14 0 M12 18v3 M8 21h8" fill="none" stroke="#7c6cff" stroke-width="1.8181818181818183" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="460" y="382" font-size="17" fill="#1f2328" font-weight="600">Speaks</text>
<text x="460" y="406" font-size="13.5" fill="#59636e">F5-TTS voices cloned from a 5 to 12</text>
<text x="460" y="425" font-size="13.5" fill="#59636e">second clip.</text>
</g>
<g class="up" style="animation-delay:0.53s"><rect x="738" y="340" width="336" height="112" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<g><rect x="756" y="360" width="44" height="44" rx="11.0" fill="url(#acc)" opacity="0.16"/><path transform="translate(764.8 368.8) scale(1.0999999999999999)" d="M3 4h18v6H3z M3 14h18v6H3z M7 7h.01 M7 17h.01" fill="none" stroke="#7c6cff" stroke-width="1.8181818181818183" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="814" y="382" font-size="17" fill="#1f2328" font-weight="600">OpenAI API server</text>
<text x="814" y="406" font-size="13.5" fill="#59636e">Chat, vision, images, speech and</text>
<text x="814" y="425" font-size="13.5" fill="#59636e">video for your own apps.</text>
</g>
<g class="up" style="animation-delay:0.59s"><rect x="30" y="470" width="336" height="112" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<g><rect x="48" y="490" width="44" height="44" rx="11.0" fill="url(#acc)" opacity="0.16"/><path transform="translate(56.8 498.8) scale(1.0999999999999999)" d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a3 3 0 0 0-3-1z M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1" fill="none" stroke="#7c6cff" stroke-width="1.8181818181818183" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="106" y="512" font-size="17" fill="#1f2328" font-weight="600">Remembers you</text>
<text x="106" y="536" font-size="13.5" fill="#59636e">Long-term memory you can view, edit</text>
<text x="106" y="555" font-size="13.5" fill="#59636e">and delete.</text>
</g>
<g class="up" style="animation-delay:0.65s"><rect x="384" y="470" width="336" height="112" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<g><rect x="402" y="490" width="44" height="44" rx="11.0" fill="url(#acc)" opacity="0.16"/><path transform="translate(410.8 498.8) scale(1.0999999999999999)" d="M12 3v12 M7 10l5 5 5-5 M4 20h16" fill="none" stroke="#7c6cff" stroke-width="1.8181818181818183" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="460" y="512" font-size="17" fill="#1f2328" font-weight="600">Finds models</text>
<text x="460" y="536" font-size="13.5" fill="#59636e">Downloads from Hugging Face; says</text>
<text x="460" y="555" font-size="13.5" fill="#59636e">how fast each will run.</text>
</g>
<g class="up" style="animation-delay:0.71s"><rect x="738" y="470" width="336" height="112" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<g><rect x="756" y="490" width="44" height="44" rx="11.0" fill="url(#acc)" opacity="0.16"/><path transform="translate(764.8 498.8) scale(1.0999999999999999)" d="M9 11V5a2 2 0 0 1 4 0v6 M13 10a2 2 0 0 1 4 0v2 M17 11a2 2 0 0 1 4 0v4a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3l-3-5a2 2 0 0 1 3-2l2 2" fill="none" stroke="#7c6cff" stroke-width="1.8181818181818183" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="814" y="512" font-size="17" fill="#1f2328" font-weight="600">Touch friendly</text>
<text x="814" y="536" font-size="13.5" fill="#59636e">Works on tablets and phones, no</text>
<text x="814" y="555" font-size="13.5" fill="#59636e">mouse needed.</text>
</g>
</svg>