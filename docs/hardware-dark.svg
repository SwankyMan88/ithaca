<text x="100" y="120" font-size="17" fill="#e6edf3" font-weight="600">RTX 30-series or newer</text>
<path d="M60 156 l4 4 8-9" fill="none" stroke="#8b7dff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="82" y="161" font-size="14" fill="#8b949e">Everything on the GPU</text>
<path d="M60 180 l4 4 8-9" fill="none" stroke="#8b7dff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="82" y="185" font-size="14" fill="#8b949e">Int8 tensor cores for prompts</text>
<path d="M60 204 l4 4 8-9" fill="none" stroke="#8b7dff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="82" y="209" font-size="14" fill="#8b949e">Fastest images and video</text>
</g>
