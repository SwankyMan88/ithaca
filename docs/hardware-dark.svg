<rect x="386" y="72" width="328" height="6" rx="3" fill="#38bdf8"/>
<path transform="translate(406 98) scale(1.25)" d="M2 7h20v10H2z M6 17v3 M18 17v3 M8 12a2 2 0 1 0 0.01 0 M16 12a2 2 0 1 0 0.01 0" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="450" y="120" font-size="17" fill="#e6edf3" font-weight="600">GTX 10 / 16, RTX 20</text>
<path d="M410 156 l4 4 8-9" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="432" y="161" font-size="14" fill="#8b949e">Chat on the GPU</text>
